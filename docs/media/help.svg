<svg xmlns="http://www.w3.org/2000/svg" width="851" height="926" viewBox="0 0 851 926" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
  <rect width="851" height="926" rx="10" fill="#0b0e14"/>
  <path d="M0 10a10 10 0 0 1 10-10h831a10 10 0 0 1 10 10v28H0z" fill="#161b26"/>
  <circle cx="20" cy="20" r="6" fill="#ff5f57"/><circle cx="38" cy="20" r="6" fill="#febc2e"/><circle cx="56" cy="20" r="6" fill="#28c840"/>
  <text x="425.5" y="25" fill="#6b7686" font-size="12" text-anchor="middle">palimorph --help</text>

<text x="22.0" y="66" fill="rgb(118,185,0)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">p</text><text x="30.4" y="66" fill="rgb(128,194,15)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">a</text><text x="38.8" y="66" fill="rgb(139,203,30)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">l</text><text x="47.2" y="66" fill="rgb(149,211,45)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">i</text><text x="55.6" y="66" fill="rgb(159,220,60)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">m</text><text x="64.0" y="66" fill="rgb(169,229,75)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">o</text><text x="72.4" y="66" fill="rgb(180,238,90)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">r</text><text x="80.8" y="66" fill="rgb(190,246,105)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">p</text><text x="89.2" y="66" fill="rgb(200,255,120)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">h</text><text x="106.0" y="66" fill="rgb(88,96,106)" textLength="8.40" lengthAdjust="spacing" xml:space="preserve">·</text><text x="122.8" y="66" fill="rgb(128,138,150)" textLength="512.40" lengthAdjust="spacing" xml:space="preserve">run Claude Code on any NVIDIA NIM, LM Studio, or Ollama model</text>

<text x="22.0" y="106" fill="#c9d3e0" font-weight="700" textLength="42.00" lengthAdjust="spacing" xml:space="preserve">USAGE</text>
<text x="38.8" y="126" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="126" fill="#c9d3e0" textLength="159.60" lengthAdjust="spacing" xml:space="preserve"> [model] [options] </text><text x="274.0" y="126" fill="rgb(88,96,106)" textLength="151.20" lengthAdjust="spacing" xml:space="preserve">[-- &lt;claude args&gt;]</text>

<text x="22.0" y="166" fill="#c9d3e0" font-weight="700" textLength="67.20" lengthAdjust="spacing" xml:space="preserve">COMMANDS</text>
<text x="38.8" y="186" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="282.4" y="186" fill="rgb(88,96,106)" textLength="529.20" lengthAdjust="spacing" xml:space="preserve">look at NVIDIA NIM, LM Studio, and Ollama at once, pick, launch</text>
<text x="38.8" y="206" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="206" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> &lt;model-id&gt;         </text><text x="282.4" y="206" fill="rgb(88,96,106)" textLength="260.40" lengthAdjust="spacing" xml:space="preserve">launch straight into that model</text>
<text x="38.8" y="226" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="226" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> --last             </text><text x="282.4" y="226" fill="rgb(88,96,106)" textLength="260.40" lengthAdjust="spacing" xml:space="preserve">reuse the last model you picked</text>
<text x="38.8" y="246" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="246" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> models             </text><text x="282.4" y="246" fill="rgb(88,96,106)" textLength="210.00" lengthAdjust="spacing" xml:space="preserve">list available NIM models</text>
<text x="38.8" y="266" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="266" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> login              </text><text x="282.4" y="266" fill="rgb(88,96,106)" textLength="294.00" lengthAdjust="spacing" xml:space="preserve">paste and store your NVIDIA API key</text>
<text x="38.8" y="286" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="286" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> logout             </text><text x="282.4" y="286" fill="rgb(88,96,106)" textLength="176.40" lengthAdjust="spacing" xml:space="preserve">remove the stored key</text>
<text x="38.8" y="306" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="306" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> status             </text><text x="282.4" y="306" fill="rgb(88,96,106)" textLength="319.20" lengthAdjust="spacing" xml:space="preserve">show key, last model, and connectivity</text>
<text x="38.8" y="326" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="326" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> proxy              </text><text x="282.4" y="326" fill="rgb(88,96,106)" textLength="252.00" lengthAdjust="spacing" xml:space="preserve">run only the translation proxy</text>
<text x="38.8" y="346" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="346" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> check &lt;model-id&gt;   </text><text x="282.4" y="346" fill="rgb(88,96,106)" textLength="378.00" lengthAdjust="spacing" xml:space="preserve">probe whether a model really makes tool calls</text>
<text x="38.8" y="366" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">palimorph</text><text x="114.4" y="366" fill="#c9d3e0" textLength="168.00" lengthAdjust="spacing" xml:space="preserve"> fav &lt;model-id&gt;     </text><text x="282.4" y="366" fill="rgb(88,96,106)" textLength="302.40" lengthAdjust="spacing" xml:space="preserve">pin a model to the top of the picker</text>

<text x="22.0" y="406" fill="#c9d3e0" font-weight="700" textLength="58.80" lengthAdjust="spacing" xml:space="preserve">OPTIONS</text>
<text x="38.8" y="426" fill="rgb(118,185,0)" textLength="84.00" lengthAdjust="spacing" xml:space="preserve">--provider</text><text x="122.8" y="426" fill="#c9d3e0" textLength="92.40" lengthAdjust="spacing" xml:space="preserve"> &lt;id&gt;      </text><text x="215.2" y="426" fill="rgb(88,96,106)" textLength="470.40" lengthAdjust="spacing" xml:space="preserve">skip auto-discovery: nvidia, lmstudio, ollama, or custom</text>
<text x="38.8" y="446" fill="rgb(118,185,0)" textLength="84.00" lengthAdjust="spacing" xml:space="preserve">--base-url</text><text x="122.8" y="446" fill="#c9d3e0" textLength="92.40" lengthAdjust="spacing" xml:space="preserve"> &lt;url&gt;     </text><text x="215.2" y="446" fill="rgb(88,96,106)" textLength="453.60" lengthAdjust="spacing" xml:space="preserve">override the endpoint (required for --provider custom)</text>
<text x="38.8" y="466" fill="rgb(118,185,0)" textLength="58.80" lengthAdjust="spacing" xml:space="preserve">--small</text><text x="97.6" y="466" fill="#c9d3e0" textLength="117.60" lengthAdjust="spacing" xml:space="preserve"> &lt;model-id&gt;   </text><text x="215.2" y="466" fill="rgb(88,96,106)" textLength="386.40" lengthAdjust="spacing" xml:space="preserve">model for Claude Code's cheap background calls</text>
<text x="38.8" y="486" fill="rgb(118,185,0)" textLength="100.80" lengthAdjust="spacing" xml:space="preserve">--max-tokens</text><text x="139.6" y="486" fill="#c9d3e0" textLength="75.60" lengthAdjust="spacing" xml:space="preserve"> &lt;n&gt;     </text><text x="215.2" y="486" fill="rgb(88,96,106)" textLength="252.00" lengthAdjust="spacing" xml:space="preserve">cap output tokens per response</text>
<text x="38.8" y="506" fill="rgb(118,185,0)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">--context</text><text x="114.4" y="506" fill="#c9d3e0" textLength="100.80" lengthAdjust="spacing" xml:space="preserve"> &lt;n&gt;        </text><text x="215.2" y="506" fill="rgb(88,96,106)" textLength="487.20" lengthAdjust="spacing" xml:space="preserve">the model's real context window (Claude Code assumes 200k)</text>
<text x="38.8" y="526" fill="rgb(118,185,0)" textLength="109.20" lengthAdjust="spacing" xml:space="preserve">--concurrency</text><text x="148.0" y="526" fill="#c9d3e0" textLength="67.20" lengthAdjust="spacing" xml:space="preserve"> &lt;n&gt;    </text><text x="215.2" y="526" fill="rgb(88,96,106)" textLength="546.00" lengthAdjust="spacing" xml:space="preserve">upstream requests in flight at once (default 1; NIM limits these)</text>
<text x="38.8" y="546" fill="rgb(118,185,0)" textLength="100.80" lengthAdjust="spacing" xml:space="preserve">--tools-only</text><text x="215.2" y="546" fill="rgb(88,96,106)" textLength="378.00" lengthAdjust="spacing" xml:space="preserve">only show models known to handle tool calling</text>
<text x="38.8" y="566" fill="rgb(118,185,0)" textLength="42.00" lengthAdjust="spacing" xml:space="preserve">--all</text><text x="215.2" y="566" fill="rgb(88,96,106)" textLength="336.00" lengthAdjust="spacing" xml:space="preserve">include non-chat endpoints in the picker</text>
<text x="38.8" y="586" fill="rgb(118,185,0)" textLength="50.40" lengthAdjust="spacing" xml:space="preserve">--port</text><text x="89.2" y="586" fill="#c9d3e0" textLength="126.00" lengthAdjust="spacing" xml:space="preserve"> &lt;n&gt;           </text><text x="215.2" y="586" fill="rgb(88,96,106)" textLength="310.80" lengthAdjust="spacing" xml:space="preserve">fixed proxy port (default: ephemeral)</text>
<text x="38.8" y="606" fill="rgb(118,185,0)" textLength="58.80" lengthAdjust="spacing" xml:space="preserve">--debug</text><text x="215.2" y="606" fill="rgb(88,96,106)" textLength="294.00" lengthAdjust="spacing" xml:space="preserve">log every proxied request to stderr</text>
<text x="38.8" y="626" fill="rgb(118,185,0)" textLength="42.00" lengthAdjust="spacing" xml:space="preserve">--bin</text><text x="80.8" y="626" fill="#c9d3e0" textLength="134.40" lengthAdjust="spacing" xml:space="preserve"> &lt;path&gt;         </text><text x="215.2" y="626" fill="rgb(88,96,106)" textLength="336.00" lengthAdjust="spacing" xml:space="preserve">Claude Code executable (default: claude)</text>
<text x="38.8" y="646" fill="rgb(118,185,0)" textLength="84.00" lengthAdjust="spacing" xml:space="preserve">-h, --help</text><text x="215.2" y="646" fill="rgb(88,96,106)" textLength="75.60" lengthAdjust="spacing" xml:space="preserve">this text</text>

<text x="22.0" y="686" fill="#c9d3e0" font-weight="700" textLength="100.80" lengthAdjust="spacing" xml:space="preserve">HOW IT WORKS</text>
<text x="38.8" y="706" fill="rgb(88,96,106)" textLength="663.60" lengthAdjust="spacing" xml:space="preserve">Upstream speaks OpenAI; Claude Code speaks Anthropic. palimorph runs a loopback</text>
<text x="38.8" y="726" fill="rgb(88,96,106)" textLength="596.40" lengthAdjust="spacing" xml:space="preserve">proxy that translates between them, hands it to a child process through</text>
<text x="38.8" y="746" fill="rgb(88,96,106)" textLength="604.80" lengthAdjust="spacing" xml:space="preserve">env vars, and tears it down on exit — your settings files are untouched.</text>

<text x="38.8" y="786" fill="rgb(88,96,106)" textLength="663.60" lengthAdjust="spacing" xml:space="preserve">With no --provider, palimorph checks NVIDIA NIM (if a key is known), LM Studio,</text>
<text x="38.8" y="806" fill="rgb(88,96,106)" textLength="646.80" lengthAdjust="spacing" xml:space="preserve">and Ollama at once and shows everything found in one picker. If NVIDIA has no</text>
<text x="38.8" y="826" fill="rgb(88,96,106)" textLength="571.20" lengthAdjust="spacing" xml:space="preserve">key yet it still shows up — picking it asks for the key right there.</text>

<text x="38.8" y="866" fill="rgb(88,96,106)" textLength="92.40" lengthAdjust="spacing" xml:space="preserve">NVIDIA key:</text><text x="139.6" y="866" fill="rgb(86,200,220)" textLength="117.60" lengthAdjust="spacing" xml:space="preserve">NVIDIA_API_KEY</text><text x="265.6" y="866" fill="rgb(88,96,106)" textLength="16.80" lengthAdjust="spacing" xml:space="preserve">or</text><text x="290.8" y="866" fill="rgb(86,200,220)" textLength="126.00" lengthAdjust="spacing" xml:space="preserve">palimorph login</text><text x="425.2" y="866" fill="rgb(88,96,106)" textLength="319.20" lengthAdjust="spacing" xml:space="preserve">· get one at https://build.nvidia.com/</text>
<text x="38.8" y="886" fill="rgb(88,96,106)" textLength="588.00" lengthAdjust="spacing" xml:space="preserve">LM Studio / Ollama need no key — just have the server running locally.</text>
</svg>
